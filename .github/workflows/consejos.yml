# Los viernes a las 12 (Argentina): consejos en #tips, meme de la semana en #memes
# y premios de chat y voz en #premios.
# También se puede correr a mano: Actions → Consejos semanales → Run workflow.
name: Consejos y premios de la semana

on:
  schedule:
    - cron: "0 15 * * 5"
  workflow_dispatch:
    inputs:
      premios_prueba:
        description: "Premios en modo prueba: cuenta y muestra en el log, sin publicar"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  consejos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # sharp: para dibujar el ranking en imagen
      - run: npm ci
      - run: npm test
      - run: node src/consejos.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
          CANAL_VINCULAR: ${{ vars.CANAL_VINCULAR || secrets.CANAL_VINCULAR }}
          CANAL_TIPS: ${{ vars.CANAL_TIPS || secrets.CANAL_TIPS }}
      # Aunque fallen los consejos, el meme de la semana sale igual
      - run: node src/meme-semana.js
        if: success() || failure()
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CANAL_MEMES: ${{ vars.CANAL_MEMES || secrets.CANAL_MEMES }}
          ROL_MEME: ${{ vars.ROL_MEME || secrets.ROL_MEME }}
      - run: node src/premios.js
        if: success() || failure()
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CANAL_PREMIOS: ${{ vars.CANAL_PREMIOS || secrets.CANAL_PREMIOS }}
          ROL_CHAT: ${{ vars.ROL_CHAT || secrets.ROL_CHAT }}
          ROL_VOZ: ${{ vars.ROL_VOZ || secrets.ROL_VOZ }}
          CATEGORIAS_CHAT: ${{ vars.CATEGORIAS_CHAT }}
          CANALES_EXCLUIDOS: ${{ vars.CANALES_EXCLUIDOS }}
          PREMIOS_PRUEBA: ${{ inputs.premios_prueba }}
