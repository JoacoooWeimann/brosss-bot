# Actualiza el ranking de CS2 del Discord cada 15 minutos.
# También se puede correr a mano: Actions → Ranking CS2 → Run workflow.
name: Ranking CS2

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      memes_ahora:
        description: "Publicar memes ahora (uno de cada comunidad), sin esperar"
        type: boolean
        default: false

# Si una vuelta tarda, la siguiente espera (no se pisan)
concurrency:
  group: ranking
  cancel-in-progress: false

# write: para guardar datos/historial.json (jugador de la semana)
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: node src/index.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          LEETIFY_API_KEY: ${{ secrets.LEETIFY_API_KEY }}
          CANAL_VINCULAR: ${{ vars.CANAL_VINCULAR || secrets.CANAL_VINCULAR }}
          CANAL_RANKING: ${{ vars.CANAL_RANKING || secrets.CANAL_RANKING }}
          CANAL_HISTORIAL: ${{ vars.CANAL_HISTORIAL || secrets.CANAL_HISTORIAL }}
          CANAL_CLIPS: ${{ vars.CANAL_CLIPS || secrets.CANAL_CLIPS }}
          TIKTOK_USUARIO: ${{ vars.TIKTOK_USUARIO }}
          CANAL_BUMP: ${{ vars.CANAL_BUMP || secrets.CANAL_BUMP }}
          ROL_BUMP: ${{ vars.ROL_BUMP || secrets.ROL_BUMP }}
          CANAL_MEMES: ${{ vars.CANAL_MEMES || secrets.CANAL_MEMES }}
          MEMES_SUBREDDITS: ${{ vars.MEMES_SUBREDDITS }}
          MEMES_CADA_MINUTOS: ${{ vars.MEMES_CADA_MINUTOS }}
          MEMES_FORZAR: ${{ inputs.memes_ahora }}
      # Si cambió el historial de la semana, lo guarda en el repo
      - name: Guardar historial
        run: |
          if [ -n "$(git status --porcelain datos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add datos
            git commit -m "Historial de la semana"
            git pull --rebase
            git push
          fi
