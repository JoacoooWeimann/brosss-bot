# Sitio de Netlify del bot: no publica una página, solo la función que
# responde los comandos con / de Discord (netlify/functions/interacciones.mjs).
[build]
  publish = "public"
  command = "echo 'sin build'"
  # El bot commitea datos/ cada 5-15 minutos: eso NO tiene que publicar de
  # nuevo el sitio (la función lee los datos directo de GitHub). Solo se
  # publica si cambió algo del código. (Si este comando sale con 0, Netlify
  # saltea el deploy.)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src netlify netlify.toml package.json package-lock.json public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # sharp no lo usa la función: que no lo empaquete
  external_node_modules = ["sharp"]
